# Synology NAS 上で動かす想定の構成。
# app(SvelteKit/adapter-node)を cloudflared 経由で外部公開する。
services:
  app:
    # GitHub Actions がビルドして GHCR に push したイメージを使う(NAS ではビルドしない)。
    # Watchtower がこのイメージの更新を監視し、新しい :latest を検知したら自動 pull → 再作成する。
    image: ghcr.io/taaaaaaachu/lowest_finder:latest
    restart: unless-stopped
    # Watchtower の監視対象に含めるラベル(WATCHTOWER_LABEL_ENABLE=true と対で機能する)。
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      # adapter-node がリバースプロキシ配下で form action / CSRF 検証に使う公開オリジン。
      # 自分のサブドメインに合わせて変更する。
      - ORIGIN=${ORIGIN:-https://lowest.example.com}
      - DATABASE_PATH=/data/app.sqlite
      - PORT=3000
    volumes:
      # バインドマウント: SQLite はプロジェクト直下 data/ に置き、File Station で
      # そのままバックアップ/リストアできるようにする(SSH 不要)。
      - ./data:/data
    # 既定では外部ポートを公開せず、cloudflared 経由でのみ到達させる。
    expose:
      - "3000"
    networks:
      proxy:
        aliases:
          - lowest-finder-app

networks:
  # cloudflared は NAS 上の共用 compose から同じネットワークに参加する。
  # 初回だけ `docker network create cloudflare-proxy` を実行する。
  proxy:
    name: cloudflare-proxy
    external: true

# ※ イメージ自動更新の Watchtower は、この lowest_finder プロジェクトには含めない。
#    NAS 全体で 1 台だけ独立プロジェクト(/volume1/docker/watchtower)として動かし、
#    Docker ホスト全体の enable ラベル付きコンテナ(この app 含む)を監視する。
#    lowest_finder を作り直しても自動更新が止まらないようにするための分離。詳細は docs/deploy.md。
