# ローカルでの動作確認専用。NAS 本番(docker-compose.yml)とは別物。
# cloudflared は使わず、ポートを直接公開し、ORIGIN を localhost にする。
#
#   docker compose -f docker-compose.local.yml up --build
#   → http://localhost:3000
services:
  app:
    build: .
    image: lowest-finder:local
    restart: "no"
    environment:
      # ローカルは http://localhost:3000 でアクセスするので ORIGIN もそれに合わせる。
      # (本番 URL のままだとログイン等の POST が CSRF で 403 になる)
      - ORIGIN=http://localhost:3000
      - DATABASE_PATH=/data/app.sqlite
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
